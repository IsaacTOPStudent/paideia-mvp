<div class="min-h-screen flex bg-gray-100">

  <!-- SIDEBAR -->
  <aside
    class="w-72 bg-gradient-to-b from-blue-700 via-blue-800 to-blue-900 text-white flex flex-col shadow-2xl border-r border-white/10">

    <!-- LOGO -->
    <div class="p-8 border-b border-white/10">

      <div class="flex items-center gap-4">

        <div
          class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center text-2xl shadow-lg">

          🧩

        </div>

        <div>

          <h1 class="text-3xl font-bold tracking-wide">

            Paideia

          </h1>

          <p class="text-blue-200 text-sm mt-1">

            Plataforma inclusiva

          </p>

        </div>

      </div>

    </div>

    <!-- NAVIGATION -->
    <nav class="flex-1 p-6 space-y-3">

      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        class="flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-white/10 transition-all duration-200 cursor-pointer">

        <span class="text-2xl">

          {{ item.icon }}

        </span>

        <span class="font-medium">

          {{ item.label }}

        </span>

      </a>

    </nav>

    <!-- FOOTER -->
    <div class="p-6 border-t border-white/10">

      <button
        (click)="logout()"
        class="w-full flex items-center justify-center gap-3 bg-red-500 hover:bg-red-600 py-4 rounded-2xl font-semibold transition-all duration-200 shadow-lg hover:scale-[1.02]">

        <span>🚪</span>

        <span>Cerrar sesión</span>

      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">

    <!-- TOPBAR -->
    <header class="h-20 bg-white shadow flex items-center justify-between px-8">

      <!-- TITLE -->
      <div>

        <h2 class="text-2xl font-bold text-gray-800">

          Panel

        </h2>

      </div>

      <!-- USER INFO -->
      <div class="flex items-center gap-4">

        <div class="text-right">

          <p class="font-semibold text-gray-800">

            {{ user?.full_name || 'Usuario Paideia' }}

          </p>

          <p class="text-sm text-gray-500">

            {{ user?.email }}

          </p>

          <div class="flex items-center justify-end gap-2 mt-1">

            <span
              class="w-3 h-3 rounded-full"
              [class.bg-green-400]="user?.status === 'ACTIVE'"
              [class.bg-red-400]="user?.status === 'INACTIVE'">
            </span>

            <p
              class="text-sm font-medium"
              [class.text-green-500]="user?.status === 'ACTIVE'"
              [class.text-red-500]="user?.status === 'INACTIVE'">

              {{ user?.status === 'ACTIVE' ? 'Activo' : 'Inactivo' }}

            </p>

          </div>

          <p class="text-xs text-blue-700 font-semibold mt-1">

            {{ user?.role }}

          </p>

        </div>

        <!-- AVATAR -->
        <div
          class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-lg">

          {{ user?.email?.charAt(0).toUpperCase() }}

        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <section class="flex-1 p-8 overflow-auto">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
