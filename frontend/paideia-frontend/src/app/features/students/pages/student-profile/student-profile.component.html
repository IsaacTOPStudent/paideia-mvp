<div *ngIf="student">

  <h1>
    {{ student.full_name }}
  </h1>

  <p>
    Documento:
    {{ student.document_number }}
  </p>

  <p>
    Género:
    {{ student.gender_display }}
  </p>

  <p>
    Grado:
    {{ student.grade }}
  </p>

  <p>
    Acudiente:
    {{ student.guardian_name }}
  </p>

</div>
