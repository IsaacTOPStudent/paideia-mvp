events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    upstream auth_backend {
        server auth-service:8000;
    }

    upstream students_backend {
        server student-service:8000;
    }

    upstream diagnostics_backend {
        server diagnostic-service:8000;
    }

    upstream evaluations_backend {
        server evaluation-service:8000;
    }

    upstream frontend_app {
        server frontend:4200;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        #API Gateway - Auth Service
        location /api/auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway - Student Service
        location /api/students/ {
            proxy_pass http://students_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

         # API Gateway - Diagnostic Service
        location /api/diagnostics/ {
            proxy_pass http://diagnostics_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway - Evaluation Service
        location /api/evaluations/ {
            proxy_pass http://evaluations_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}